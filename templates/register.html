<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — CampusSafe</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="{{ url_for('index') }}"><span class="dot"></span>CampusSafe</a>
    <h1>Create your account</h1>
    <p class="sub">Takes less than a minute.</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <label for="name">Full name</label><input id="name" name="name" required autofocus>
      <label for="email">Email</label><input id="email" name="email" type="email" required>
      <label for="phone">Phone</label><input id="phone" name="phone" type="tel" placeholder="Shared with security during an SOS">
      <label for="role">I am a</label>
      <select id="role" name="role"><option value="student">Student</option><option value="faculty">Faculty / staff</option></select>
      <label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required placeholder="At least 8 characters">
      <button class="btn lg" style="margin-top:22px" type="submit">Create account</button>
    </form>
    <p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
</body>
</html>
